##### 기본 설정 #####

# prefix 변경 (Ctrl-a)
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# 마우스 사용 (복사, 창 전환, 크기 조절 등 가능)
setw -g mouse on

# 창 번호 1부터 시작
set -g base-index 1
setw -g pane-base-index 1

# 스크롤백 길이 증가
set -g history-limit 10000

# 상태줄 설정
set -g status-interval 5
set -g status-left '#[fg=green][#S]'
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M'

# 색상 지원
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind s split-window -v
bind v split-window -h

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes like vim
# feel free to change the "1" to however many lines you want to resize by, only
# one at a time can be slow
bind < resize-pane -L 1
bind > resize-pane -R 1
bind - resize-pane -D 1
bind + resize-pane -U 1

# bind : to command-prompt like vim
# this is the default in tmux already
bind : command-prompt

bind m last-window


##### Copy Mode 개선 #####

# vi 스타일
setw -g mode-keys vi

# 선택하고 복사하기
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi Y send -X copy-pipe-and-cancel "xclip -selection clipboard -i -rmlastnl"

# 마우스로 드래그해서 복사 → 시스템 클립보드 연동
# (터미널에서 직접 복사 가능하도록 아래 설정 필수)
set -g set-clipboard on


##### reload 단축키 #####
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"


##### 플러그인 매니저 (TPM) #####
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# plugin install : <Ctrl+a, I>
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
